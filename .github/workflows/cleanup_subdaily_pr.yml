name: cleanup-subdaily-pr

on:
  push:
    branches:
      - fix/subdaily-daily-eused-hybam
    paths:
      - .github/workflows/cleanup_subdaily_pr.yml

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/subdaily-daily-eused-hybam
          fetch-depth: 0

      - name: Rewrite original processors in place
        shell: bash
        run: |
          cp EUSEDcollab/process_eusedcollab_to_cf18_wzx_impl.py EUSEDcollab/process_eusedcollab_to_cf18_wzx.py
          cp HYBAM/hybam_comprehensive_processor_impl.py HYBAM/hybam_comprehensive_processor.py

          python - <<'PY'
          from pathlib import Path

          # ------------------------------------------------------------------
          # EUSEDcollab: retain the original script and insert daily aggregation
          # directly into read_station_data().
          # ------------------------------------------------------------------
          eused_path = Path('EUSEDcollab/process_eusedcollab_to_cf18_wzx.py')
          text = eused_path.read_text(encoding='utf-8')

          import_anchor = 'from code.units import convert_ssl_units_if_needed\n'
          import_line = 'from code.daily_aggregation import aggregate_eused_to_daily\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise RuntimeError('EUSED import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          return_anchor = "    df['Q_derived'] = q_derived\n    df['SSC_derived'] = ssc_derived\n    df['SSL_derived'] = ssl_derived\n    return df[['date', 'Q', 'SSC', 'SSL', 'Q_derived', 'SSC_derived', 'SSL_derived']]\n"
          replacement = """    df['Q_derived'] = q_derived
    df['SSC_derived'] = ssc_derived
    df['SSL_derived'] = ssl_derived

    # Collapse sub-daily/duplicate same-day rows to one daily record before QC.
    # Q and SSC use arithmetic daily means. When both daily values are present,
    # daily SSL is recalculated from daily Q and SSC; sediment-only days retain
    # the mean available SSL so the SSC|SSL eligibility rule is preserved.
    day_counts = pd.to_datetime(df['date'], errors='coerce').dt.floor('D').value_counts()
    n_problem_days = int((day_counts > 1).sum())
    n_rows_before_daily = len(df)
    df = aggregate_eused_to_daily(df, fill_value=FILL_VALUE, factor=0.0864)
    if n_problem_days:
        print(
            f\"  Daily aggregation: collapsed {n_rows_before_daily} rows to {len(df)} \"
            f\"daily rows across {n_problem_days} day(s) with multiple records.\"
        )

    return df[['date', 'Q', 'SSC', 'SSL', 'Q_derived', 'SSC_derived', 'SSL_derived']]
"""
          if return_anchor not in text:
              raise RuntimeError('EUSED read_station_data return anchor not found')
          text = text.replace(return_anchor, replacement, 1)
          eused_path.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # HYBAM: retain the original script and replace only merge_discharge_ssc
          # so raw Q and SSC are independently aggregated to UTC-day means before
          # alignment and downstream QC/SSL calculation.
          # ------------------------------------------------------------------
          hybam_path = Path('HYBAM/hybam_comprehensive_processor.py')
          text = hybam_path.read_text(encoding='utf-8')

          import_anchor = "from code.constants import (\n    FILL_VALUE_FLOAT,\n    FILL_VALUE_INT,\n)\n"
          import_line = "from code.daily_aggregation import aggregate_unix_series_to_daily, align_daily_series\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise RuntimeError('HYBAM import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          start = text.index('    def merge_discharge_ssc(self, discharge_file, ssc_file):\n')
          end = text.index('    def apply_qc_checks(self, data_dict):\n', start)

          new_method = '''    def merge_discharge_ssc(self, discharge_file, ssc_file):
        """Aggregate raw Q and SSC independently to UTC-day means, then align them.

        The former nearest-SSC-to-every-Q-timestamp mapping could duplicate one
        SSC observation across several sub-daily Q timestamps. This method first
        computes arithmetic daily means for each raw source independently, then
        aligns the unique daily dates. When both sources exist, the legacy
        overlapping-period requirement is retained, but overlap is evaluated on
        UTC calendar days and the daily axis is the union of Q and SSC days
        inside that common period. Downstream apply_qc_checks() recalculates SSL
        from the resulting daily Q and SSC values.
        """
        result = {
            'time': None,
            'discharge': None,
            'ssc': None,
            'discharge_origin': None,
            'discharge_quality': None,
            'ssc_origin': None,
            'ssc_quality': None,
            'time_coverage_start': None,
            'time_coverage_end': None,
            'q_start': None,
            'q_end': None,
            'ssc_start': None,
            'ssc_end': None,
        }

        q_raw_t = q_raw_v = None
        s_raw_t = s_raw_v = None
        q_daily_t = q_daily_v = np.asarray([], dtype=float)
        s_daily_t = s_daily_v = np.asarray([], dtype=float)

        if discharge_file:
            q_raw_t, q_raw_v, _, q_fill, q_origin, q_quality = self.read_nc_data(discharge_file)
            result['discharge_raw'] = q_raw_v
            result['discharge_fill'] = q_fill
            result['discharge_origin'] = q_origin
            result['discharge_quality'] = q_quality
            q_daily_t, q_daily_v = aggregate_unix_series_to_daily(
                q_raw_t,
                q_raw_v,
                fill_values=(q_fill, FILL_VALUE_FLOAT),
            )

        if ssc_file:
            s_raw_t, s_raw_v, _, s_fill, s_origin, s_quality = self.read_nc_data(ssc_file)
            result['ssc_raw'] = s_raw_v
            result['ssc_fill'] = s_fill
            result['ssc_origin'] = s_origin
            result['ssc_quality'] = s_quality
            s_daily_t, s_daily_v = aggregate_unix_series_to_daily(
                s_raw_t,
                s_raw_v,
                fill_values=(s_fill, FILL_VALUE_FLOAT),
            )

        if q_raw_t is not None and s_raw_t is not None:
            if q_daily_t.size and s_daily_t.size:
                overlap_start = max(float(np.min(q_daily_t)), float(np.min(s_daily_t)))
                overlap_end = min(float(np.max(q_daily_t)), float(np.max(s_daily_t)))
                if overlap_start <= overlap_end:
                    time_axis, aligned = align_daily_series(
                        {
                            'discharge': (q_daily_t, q_daily_v),
                            'ssc': (s_daily_t, s_daily_v),
                        },
                        start=overlap_start,
                        end=overlap_end,
                    )
                    result['time'] = time_axis
                    result['discharge'] = aligned['discharge']
                    result['ssc'] = aligned['ssc']
                else:
                    result['time'] = np.asarray([], dtype=float)
                    result['discharge'] = np.asarray([], dtype=float)
                    result['ssc'] = np.asarray([], dtype=float)
            else:
                result['time'] = np.asarray([], dtype=float)
                result['discharge'] = np.asarray([], dtype=float)
                result['ssc'] = np.asarray([], dtype=float)
        elif q_raw_t is not None:
            result['time'] = q_daily_t
            result['discharge'] = q_daily_v
            result['ssc'] = np.full(q_daily_t.size, np.nan, dtype=float)
        elif s_raw_t is not None:
            result['time'] = s_daily_t
            result['ssc'] = s_daily_v
            result['discharge'] = np.full(s_daily_t.size, np.nan, dtype=float)

        if result['time'] is not None and len(result['time']) > 0:
            result['time_coverage_start'] = datetime.utcfromtimestamp(
                float(result['time'][0])
            ).strftime('%Y-%m-%d')
            result['time_coverage_end'] = datetime.utcfromtimestamp(
                float(result['time'][-1])
            ).strftime('%Y-%m-%d')

        before_q = 0 if q_raw_t is None else int(np.size(q_raw_t))
        before_s = 0 if s_raw_t is None else int(np.size(s_raw_t))
        after_q = int(q_daily_t.size)
        after_s = int(s_daily_t.size)
        if before_q > after_q or before_s > after_s:
            print(
                '    Daily aggregation: Q {0}->{1} rows; SSC {2}->{3} rows.'.format(
                    before_q, after_q, before_s, after_s
                )
            )

        return result


'''
          text = text[:start] + new_method + text[end:]
          hybam_path.write_text(text, encoding='utf-8')
          PY

          rm EUSEDcollab/process_eusedcollab_to_cf18_wzx_impl.py
          rm HYBAM/hybam_comprehensive_processor_impl.py
          rm .github/workflows/cleanup_subdaily_pr.yml

      - name: Validate syntax and aggregation tests
        shell: bash
        run: |
          python -m py_compile EUSEDcollab/process_eusedcollab_to_cf18_wzx.py HYBAM/hybam_comprehensive_processor.py code/daily_aggregation.py
          python -m pip install --quiet numpy pandas pytest
          python -m pytest -q test/test_daily_subdaily_aggregation.py

      - name: Commit cleaned PR
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: integrate subdaily aggregation in original processors"
          git push origin HEAD:fix/subdaily-daily-eused-hybam
